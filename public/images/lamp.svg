<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- Light cone -->
  <polygon points="170,140 230,140 330,340 70,340" fill="url(#lampGlow)" />
  <!-- Shade -->
  <polygon points="160,140 240,140 270,200 130,200" fill="#e11d48"/>
  <!-- Pole -->
  <line x1="200" y1="200" x2="200" y2="330" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <!-- Base -->
  <ellipse cx="200" cy="335" rx="55" ry="12" fill="#334155"/>
</svg>
