<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="watchScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Straps -->
  <rect x="160" y="40" width="80" height="90" rx="10" fill="#334155"/>
  <rect x="160" y="270" width="80" height="90" rx="10" fill="#334155"/>
  <!-- Watch case -->
  <rect x="130" y="115" width="140" height="170" rx="35" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <!-- Dial / Screen -->
  <rect x="145" y="130" width="110" height="140" rx="25" fill="#000000"/>
  <!-- UI Circle -->
  <circle cx="200" cy="200" r="40" fill="none" stroke="url(#watchScreen)" stroke-width="6" stroke-dasharray="180 60"/>
  <!-- Time text -->
  <text x="200" y="206" fill="#ffffff" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">10:09</text>
  <!-- Crown button -->
  <rect x="272" y="175" width="8" height="30" rx="4" fill="#94a3b8"/>
</svg>
