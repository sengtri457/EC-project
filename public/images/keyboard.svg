    <!-- Row 1 -->
    <rect x="70" y="150" width="22" height="18" rx="4"/>
    <rect x="100" y="150" width="22" height="18" rx="4"/>
    <rect x="130" y="150" width="22" height="18" rx="4"/>
    <rect x="160" y="150" width="22" height="18" rx="4"/>
    <rect x="190" y="150" width="22" height="18" rx="4"/>
    <rect x="220" y="150" width="22" height="18" rx="4"/>
    <rect x="250" y="150" width="22" height="18" rx="4"/>
    <rect x="280" y="150" width="48" height="18" rx="4" fill="#6366f1"/>
    <!-- Row 2 -->
    <rect x="70" y="180" width="30" height="18" rx="4"/>
    <rect x="108" y="180" width="22" height="18" rx="4"/>
    <rect x="138" y="180" width="22" height="18" rx="4"/>
    <rect x="168" y="180" width="22" height="18" rx="4"/>
